<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .box{rx:10;ry:10;stroke-width:1.5;}
      .lbl{font-size:13px;font-weight:600;}
      .sub{font-size:10.5px;fill:#6b7280;}
      .edge{stroke:#6b7280;stroke-width:1.6;fill:none;marker-end:url(#arr);}
      .edgelbl{font-size:10px;fill:#6b7280;}
      .hdr{font-size:12px;font-weight:700;letter-spacing:.4px;}
      .ttl{font-size:16px;font-weight:700;fill:#111827;}
    </style>
  </defs>

  <text x="30" y="34" class="ttl">quick-dingtalk-mcp &#8212; talk to DingTalk as <tspan fill="#7c3aed">yourself</tspan></text>

  <!-- ===================== LOCAL LANE ===================== -->
  <rect x="20" y="58" width="860" height="150" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="40" y="82" class="hdr" fill="#7c3aed">LOCAL MCP &#183; just you, on your machine</text>

  <!-- host -->
  <rect x="40" y="98"  width="150" height="78" class="box" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="115" y="128" text-anchor="middle" class="lbl">Amazon Quick</text>
  <text x="115" y="145" text-anchor="middle" class="lbl">Desktop</text>
  <text x="115" y="163" text-anchor="middle" class="sub">(MCP host)</text>

  <!-- server -->
  <rect x="270" y="98" width="180" height="78" class="box" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="360" y="126" text-anchor="middle" class="lbl">server.mjs</text>
  <text x="360" y="144" text-anchor="middle" class="sub">packages/local</text>
  <text x="360" y="161" text-anchor="middle" class="sub">38 tools</text>

  <!-- dws -->
  <rect x="530" y="98" width="150" height="78" class="box" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="605" y="132" text-anchor="middle" class="lbl">dws CLI</text>
  <text x="605" y="150" text-anchor="middle" class="sub">your OAuth login</text>

  <!-- dingtalk (shared, right) -->
  <rect x="740" y="150" width="130" height="150" class="box" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="805" y="222" text-anchor="middle" class="lbl" fill="#4338ca">DingTalk</text>
  <text x="805" y="240" text-anchor="middle" class="sub">mcp-gw.dingtalk.com</text>
  <text x="805" y="262" text-anchor="middle" class="sub">posted as YOU</text>

  <path class="edge" d="M190,137 L268,137"/>
  <text x="229" y="130" text-anchor="middle" class="edgelbl">stdio</text>
  <path class="edge" d="M450,137 L528,137"/>
  <text x="489" y="130" text-anchor="middle" class="edgelbl">exec</text>
  <path class="edge" d="M680,140 C715,150 720,175 742,188"/>
  <text x="712" y="160" text-anchor="middle" class="edgelbl">HTTPS</text>

  <!-- ===================== REMOTE LANE ===================== -->
  <rect x="20" y="226" width="700" height="184" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="40" y="250" class="hdr" fill="#16a34a">REMOTE MCP &#183; one deploy, whole team (AWS Bedrock AgentCore)</text>

  <!-- host -->
  <rect x="40" y="266" width="150" height="80" class="box" fill="#ffffff" stroke="#86efac"/>
  <text x="115" y="296" text-anchor="middle" class="lbl">Amazon Quick</text>
  <text x="115" y="313" text-anchor="middle" class="lbl">Desktop</text>
  <text x="115" y="331" text-anchor="middle" class="sub">HTTPS + Bearer</text>

  <!-- middleware -->
  <rect x="262" y="266" width="190" height="80" class="box" fill="#ffffff" stroke="#86efac"/>
  <text x="357" y="292" text-anchor="middle" class="lbl">mcp-middleware</text>
  <text x="357" y="309" text-anchor="middle" class="sub">CloudFront + API GW</text>
  <text x="357" y="325" text-anchor="middle" class="sub">verify HMAC &#183; per-user token</text>

  <!-- runtime -->
  <rect x="520" y="266" width="180" height="80" class="box" fill="#ffffff" stroke="#86efac"/>
  <text x="610" y="292" text-anchor="middle" class="lbl">AgentCore Runtime</text>
  <text x="610" y="309" text-anchor="middle" class="sub">container runs dws</text>
  <text x="610" y="325" text-anchor="middle" class="sub">per-user config</text>

  <path class="edge" d="M190,306 L260,306"/>
  <path class="edge" d="M452,306 L518,306"/>
  <!-- remote -> dingtalk (up to shared dingtalk box) -->
  <path class="edge" d="M700,300 C725,290 725,270 742,258"/>
  <text x="735" y="290" text-anchor="middle" class="edgelbl">HTTPS</text>

  <text x="40" y="392" class="sub">Each teammate authorizes once with their own DingTalk account &#8212; messages post under their identity. Zero code / no redeploy to add a user.</text>
</svg>
